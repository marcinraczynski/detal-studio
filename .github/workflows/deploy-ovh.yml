name: Wdrożenie na OVH

# Uruchamia się po każdej zmianie na gałęzi main; można też ręcznie:
# zakładka Actions → "Wdrożenie na OVH" → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dane FTP: cztery osobne sekrety FTP_* albo jeden zbiorczy sekret DETAL.
      # Krok nie wypisuje żadnych wartości, tylko to, które pola rozpoznał.
      - name: Odczytaj dane FTP
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          DETAL: ${{ secrets.DETAL }}
        run: python3 .github/ftp-config.py

      - name: Wyślij pliki przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ steps.ftp.outputs.username }}
          password: ${{ steps.ftp.outputs.password }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            CLAUDE.md
            .nojekyll
