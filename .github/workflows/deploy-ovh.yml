name: Wdrożenie na OVH

# Uruchamia się po każdej zmianie na gałęzi main; można też ręcznie:
# zakładka Actions → "Wdrożenie na OVH" → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dane FTP: cztery osobne sekrety FTP_* albo jeden zbiorczy sekret DETAL.
      # Krok nie wypisuje żadnych wartości, tylko to, które pola rozpoznał.
      - name: Odczytaj dane FTP
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          DETAL: ${{ secrets.DETAL }}
        run: python3 .github/ftp-config.py

      # OVH nie obsługuje FTPS, więc pliki idą przez SFTP (te same dane co do FTP).
      - name: Wyślij pliki przez SFTP
        env:
          LFTP_PASSWORD: ${{ steps.ftp.outputs.password }}
          FTP_HOST: ${{ steps.ftp.outputs.server }}
          FTP_USER: ${{ steps.ftp.outputs.username }}
          FTP_TARGET: ${{ steps.ftp.outputs.dir }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir _site
          rsync -a --exclude='.git*' --exclude='_site' --exclude='CLAUDE.md' --exclude='.nojekyll' ./ _site/
          lftp --env-password -u "$FTP_USER" "sftp://$FTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            set cmd:fail-exit yes;
            mirror --reverse --verbose --no-perms _site/ $FTP_TARGET;
            cls -1 $FTP_TARGET;
            bye"
