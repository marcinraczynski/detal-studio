name: Wdrożenie na OVH

# Uruchamia się po każdej zmianie na gałęzi main; można też ręcznie:
# zakładka Actions → "Wdrożenie na OVH" → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź konfigurację (bez pokazywania wartości)
        run: |
          echo "Sekrety:  FTP_SERVER=${{ secrets.FTP_SERVER != '' }} FTP_USERNAME=${{ secrets.FTP_USERNAME != '' }} FTP_PASSWORD=${{ secrets.FTP_PASSWORD != '' }} FTP_DIR=${{ secrets.FTP_DIR != '' }} DETAL=${{ secrets.DETAL != '' }}"
          echo "Zmienne:  FTP_SERVER=${{ vars.FTP_SERVER != '' }} FTP_USERNAME=${{ vars.FTP_USERNAME != '' }} FTP_PASSWORD=${{ vars.FTP_PASSWORD != '' }} FTP_DIR=${{ vars.FTP_DIR != '' }}"
      - name: Wyślij pliki przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || vars.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            CLAUDE.md
            .nojekyll
