<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie ma takiej strony · Detal Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0a0b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Geist:wght@300;400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0a0b;--line:#2c2629;--paper:#efe9e6;--muted:#8e8488;--pink:#e2337f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--ink);color:#cdc5c2;font:300 17px/1.6 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--pink);color:var(--paper)}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
main{width:100%;max-width:44rem;padding:40px clamp(20px,4vw,56px)}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 22px;font:400 11px "Geist Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pink)}
h1{font:400 clamp(3rem,8vw,6rem)/.98 "Instrument Serif","Times New Roman",serif;letter-spacing:-.015em;color:var(--paper);margin:0 0 24px;text-wrap:balance}
h1 em{color:var(--pink)}
p{margin:0 0 34px}
.trace{position:relative;height:9px;margin-bottom:34px}
.trace::before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--pink);transform-origin:left}
.trace::after{content:"";position:absolute;top:0;left:calc(100% - 9px);width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 18px 4px rgba(226,51,127,.45)}
@media (prefers-reduced-motion:no-preference){
  .trace::before{animation:draw 1.1s .2s cubic-bezier(.4,0,.2,1) both}
  .trace::after{animation:run 1.1s .2s cubic-bezier(.4,0,.2,1) both}
}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes run{from{left:0}to{left:calc(100% - 9px)}}
a{display:inline-block;font:400 15px "Geist",system-ui,sans-serif;text-decoration:none;padding:11px 20px;border:1px solid var(--pink);border-radius:999px;color:var(--paper);transition:background .2s}
a:hover{background:var(--pink)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">404 · Page not found</p>
  <h1>Tej strony <em>nie ma</em>.</h1>
  <p>Adres jest błędny albo strona została przeniesiona.</p>
  <div class="trace" aria-hidden="true"></div>
  <a href="/">Wróć na stronę główną</a>
</main>
</body>
</html>
