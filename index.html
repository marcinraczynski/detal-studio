<style>
:root{
  /* Layout: one pink line travels through 3D space; the camera follows it from station to station, text sits where the object is not */
  --ink:#0c0a0b;
  --line:#2c2629;
  --paper:#efe9e6;
  --muted:#8e8488;
  --pink:#e2337f;
  --f-display:"Instrument Serif","Times New Roman",serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gutter:clamp(20px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:300;font-size:clamp(16px,1.05vw,18px);line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:var(--pink);color:var(--paper)}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}

header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px var(--gutter);background:linear-gradient(var(--ink) 20%,rgba(12,10,11,0))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.brand svg{width:38px;height:38px;flex:none}
.actions{display:flex;align-items:center;gap:14px}
.lang{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--paper);transition:transform .32s cubic-bezier(.3,.7,.2,1)}
.lang[data-lang="en"]::before{transform:translateX(100%)}
.lang button{position:relative;background:none;border:0;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:.1em;padding:6px 10px;border-radius:999px;cursor:pointer;transition:color .25s}
.lang button[aria-pressed="true"]{color:var(--ink)}
[data-i18n]{transition:opacity .2s ease}
.send,.chip span{transition:background .2s,border-color .2s,color .2s}
body.lang-swap [data-i18n]{opacity:0!important}
body.lang-swap .cta-sm,body.lang-swap .send,body.lang-swap .chip span{opacity:1!important;color:transparent!important}
@media (prefers-reduced-motion:reduce){.lang::before,.lang button,[data-i18n],.cta-sm{transition:none}}
.cta-sm{font:400 14px var(--f-body);text-decoration:none;padding:9px 16px;border:1px solid var(--pink);border-radius:999px;color:var(--paper);white-space:nowrap;text-align:center;overflow:hidden;transition:background .2s,color .2s,width .45s cubic-bezier(.3,.7,.2,1)}
.cta-sm:hover{background:var(--pink)}

.rail{position:fixed;right:var(--gutter);top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:14px;justify-items:end}
.rail button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);font:400 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.rail button span{opacity:0;transform:translateX(6px);transition:opacity .25s,transform .25s}
.rail button:hover span,.rail button.on span{opacity:1;transform:none}
.rail button i{width:18px;height:1px;background:var(--line);transition:width .25s,background .25s}
.rail button.on{color:var(--paper)}
.rail button.on i{width:34px;background:var(--pink)}

.hud{position:fixed;left:var(--gutter);bottom:18px;z-index:5;display:flex;gap:22px;font:400 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none;transition:opacity .3s}
.hud b{font-weight:500;color:var(--paper)}

main{position:relative;z-index:1}
section{padding:0 var(--gutter)}
.chapter{min-height:165vh}
.text{position:sticky;top:var(--top,24vh);max-width:min(32rem,42vw);padding:12px 0}
.pos-r{margin-left:auto;margin-right:clamp(0px,9vw,9rem)}
.pos-c{margin-left:auto;margin-right:auto;max-width:min(60rem,86vw);text-align:center}
.pos-c .eyebrow{justify-content:center}
#start{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding-top:90px;padding-bottom:60px}
#start .text{position:static;max-width:min(38rem,46vw)}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 22px;font:400 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pink);flex:none}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(3.1rem,7vw,7rem);line-height:.98;letter-spacing:-.015em;margin-bottom:28px}
h2{font-size:clamp(2.5rem,4.8vw,4.6rem);line-height:1;letter-spacing:-.01em;margin-bottom:24px}
h1 em,h2 em{font-style:italic;color:var(--pink)}
p{margin:0 0 14px;color:#cdc5c2}
.lead{font-size:clamp(17px,1.25vw,20px);color:var(--paper)}
.hint{margin-top:40px;display:flex;align-items:center;gap:12px;font:400 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hint::after{content:"";width:1px;height:34px;background:linear-gradient(var(--pink),transparent)}

/* varied text treatments */
#calosc{min-height:138vh}
#calosc h2{font-size:clamp(3rem,8.4vw,8.6rem);line-height:.94;margin:0}
.area .num{display:block;font:400 11px var(--f-mono);letter-spacing:.16em;color:var(--pink);margin-bottom:10px}
.area h2{font-size:clamp(3.4rem,8vw,8rem);line-height:.9;margin-bottom:22px}
.area p{font-size:clamp(17px,1.25vw,20px);max-width:24rem}
.area.pos-r{text-align:right}
.area.pos-r p{margin-left:auto}
.area.it h2{font-style:italic}
.side{border-left:1px solid var(--pink);padding-left:26px}
.roles{white-space:nowrap;font:400 clamp(9px,2.7vw,11px)/2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--paper);margin:18px 0}

#kontakt{min-height:100vh;padding-top:16vh}
#kontakt .text{position:static;max-width:min(36rem,46vw)}
form{display:grid;gap:22px;margin-top:30px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend,.f{display:block;margin-bottom:10px;font:400 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f{color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:8px 15px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:#cdc5c2;cursor:pointer;background:rgba(12,10,11,.5);transition:border-color .2s,background .2s,color .2s}
.chip span:hover{border-color:var(--muted)}
.chip input:checked+span{border-color:var(--pink);background:rgba(226,51,127,.2);color:var(--paper)}
.chip input:focus-visible+span{outline:2px solid var(--pink);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:22px}
input[type=text],input[type=email],textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--paper);font:300 16px/1.5 var(--f-body);padding:8px 0}
textarea{resize:vertical;min-height:92px}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--pink)}
input::placeholder,textarea::placeholder{color:#5f565a}
.submit{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.send{background:var(--pink);color:var(--paper);border:0;border-radius:999px;padding:15px 28px;font:500 15px var(--f-body);cursor:pointer;transition:background .2s,color .2s}
.send:hover{background:var(--paper);color:var(--ink)}
.alt{font-size:14px;color:var(--muted);margin:0}
.alt a{color:var(--paper);text-underline-offset:3px}
.consent{margin:10px 0 0;font-size:12px;line-height:1.55;color:#7a7175}
.consent a{color:inherit;text-underline-offset:3px}
.consent a:hover{color:var(--paper)}
.err{color:#ff7fb3;font-size:14px;min-height:1.4em;margin:-8px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.send[disabled]{opacity:.6;cursor:default}
.done{display:none;outline:none}
.done .lead{margin-bottom:34px}
.trace{position:relative;height:9px;margin-bottom:30px}
.trace::before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--pink);transform-origin:left}
.trace::after{content:"";position:absolute;top:0;left:calc(100% - 9px);width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 18px 4px rgba(226,51,127,.45)}
.sent>h2,.sent>p:not(.eyebrow){display:none}
@media (prefers-reduced-motion:no-preference){
  .sent .done>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .sent .done>p.lead{animation-delay:.12s}
  .sent .done>.alt{animation-delay:.9s}
  .sent .trace{animation:none}
  .sent .trace::before{animation:draw 1.1s .25s cubic-bezier(.4,0,.2,1) both}
  .sent .trace::after{animation:run 1.1s .25s cubic-bezier(.4,0,.2,1) both}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes run{from{left:0}to{left:calc(100% - 9px)}}
.sent form{display:none}
.sent .done{display:block}

footer{position:relative;z-index:1;padding:14vh var(--gutter) 50px;font:400 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.cookie{position:fixed;z-index:20;right:var(--gutter);bottom:18px;width:min(23rem,calc(100vw - 2 * var(--gutter)));padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(12,10,11,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cookie[hidden]{display:none}
.cookie p{margin:0 0 12px;font-size:13px;line-height:1.5;color:#cdc5c2}
.cookie a{text-underline-offset:3px}
.cookie div{display:flex;gap:8px;justify-content:flex-end}
.cookie button{font:400 13px var(--f-body);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--paper);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.cookie button:hover{border-color:var(--muted)}
.cookie #ck-yes{border-color:var(--pink)}
.cookie #ck-yes:hover{background:var(--pink)}
body.lang-swap .cookie button{opacity:1!important;color:transparent!important}
@media (max-width:860px){
  .rail,.hud,.cta-sm,.brand .word{display:none}
  #start{align-items:flex-end;padding-bottom:10svh}
  #start .text{max-width:none}
  .chapter .text{top:46svh;max-width:none;margin:0 calc(var(--gutter) * -1);margin-right:calc(var(--gutter) * -1);padding:20px var(--gutter) 24px;background:rgba(12,10,11,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-align:left}
  .chapter .pos-c{text-align:center}
  .area.pos-r p{margin-left:0}
  .side{border-left:0}
  #kontakt{padding-top:50svh}
  #kontakt .text{max-width:none;margin:0 calc(var(--gutter) * -1);padding:24px var(--gutter);background:rgba(12,10,11,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .row{grid-template-columns:1fr}
}
</style>

  // 1 → 2: scattered observations settle into a lattice
  const NP = 216, G = 6;
  const cloud = new Float32Array(NP * 3), lattice = new Float32Array(NP * 3), pDelay = new Float32Array(NP), pPhase = new Float32Array(NP);
  const pPos = new Float32Array(NP * 3);
  {
    const e = new THREE.Euler(0.5, 0.65, 0.2), v = new THREE.Vector3();
    let n = 0;
    for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) for (let k = 0; k < G; k++, n++) {
      let a, b, c; do { a = rnd()*2-1; b = rnd()*2-1; c = rnd()*2-1; } while (a*a + b*b + c*c > 1);
      cloud[3*n] = a * 7; cloud[3*n+1] = b * 4.6; cloud[3*n+2] = c * 5.5;
      v.set((i - 2.5) * 0.85, (j - 2.5) * 0.85, (k - 2.5) * 0.85).applyEuler(e).add(ST[2]);
      lattice[3*n] = v.x; lattice[3*n+1] = v.y; lattice[3*n+2] = v.z;
      pDelay[n] = rnd() * 0.3; pPhase[n] = rnd() * 6.28;
    }
  }
  const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
  const pts = new THREE.Points(pGeo, ptsMat(0.13, 0.95)); pts.frustumCulled = false; scene.add(pts);
  const pairs = [];
  { const id = (i, j, k) => (i * G + j) * G + k;
    for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) for (let k = 0; k < G; k++) {
      if (i < G-1) pairs.push(id(i,j,k), id(i+1,j,k)); if (j < G-1) pairs.push(id(i,j,k), id(i,j+1,k)); if (k < G-1) pairs.push(id(i,j,k), id(i,j,k+1));
    } }
  const lPos = new Float32Array(pairs.length * 3);
  const lGeo = new THREE.BufferGeometry(); lGeo.setAttribute("position", new THREE.BufferAttribute(lPos, 3));
  const latLines = new THREE.LineSegments(lGeo, lineMat(0)); latLines.frustumCulled = false; scene.add(latLines);

  // 4: strategy – nested geodesic shells with axes
  const strat = new THREE.Group(); strat.position.copy(ST[4]); scene.add(strat);
  const sOuter = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.75, 1)), lineMat(0.4));
  const sMid = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.15, 0)), lineMat(0.75));
  const sIn = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(0.55, 0)), lineMat(0.9, PINK));
  const sPts = new THREE.Points(new THREE.IcosahedronGeometry(1.75, 1), ptsMat(0.09, 1));
  sOuter.add(sPts);
  const sAxes = new THREE.Group();
  { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute([-3.2,0,0, 3.2,0,0, 0,-3.2,0, 0,3.2,0, 0,0,-3.2, 0,0,3.2], 3)); sAxes.add(new THREE.LineSegments(g, lineMat(0.22))); }
  const sRing = new THREE.LineLoop(circle(2.45, 128), lineMat(0.3)); sRing.rotation.set(1.1, 0, 0.3);
  strat.add(sOuter, sMid, sIn, sAxes, sRing);

  // 5: brand – square frames around a ring, turning a quarter on the way, so the four edges join into one continuous line
  const brand = new THREE.Group(); brand.position.copy(ST[5]); brand.rotation.set(1.0, 0, -0.3); scene.add(brand);
  const ring = new THREE.Group(); brand.add(ring);
  const BR = 1.95, BA = 0.82, BN = 56;
  const ringPt = (phi, k, out, o) => {
    const al = phi / 4 + Math.PI / 4 + k * Math.PI / 2, q = BR + BA * Math.cos(al);
    out[o] = q * Math.cos(phi); out[o + 1] = BA * Math.sin(al); out[o + 2] = q * Math.sin(phi);
  };
  { const sq = new Float32Array(BN * 4 * 2 * 3), nodes = new Float32Array(BN * 4 * 3), tmpA = [0, 0, 0];
    for (let s2 = 0; s2 < BN; s2++) for (let k = 0; k < 4; k++) {
      const phi = s2 / BN * Math.PI * 2;
      ringPt(phi, k, sq, (s2 * 4 + k) * 6); ringPt(phi, k + 1, sq, (s2 * 4 + k) * 6 + 3);
      ringPt(phi, k, nodes, (s2 * 4 + k) * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(sq, 3));
    ring.add(new THREE.LineSegments(g, lineMat(0.2)));
    const edge = new Float32Array(BN * 4 * 3);
    for (let m = 0; m < BN * 4; m++) ringPt(m / BN * Math.PI * 2, 0, edge, m * 3);
    const eg = new THREE.BufferGeometry(); eg.setAttribute("position", new THREE.BufferAttribute(edge, 3));
    ring.add(new THREE.LineLoop(eg, lineMat(0.6)));
    const ng = new THREE.BufferGeometry(); ng.setAttribute("position", new THREE.BufferAttribute(nodes, 3));
    ring.add(new THREE.Points(ng, ptsMat(0.085, 0.95)));
  }
  // one frame travels through the whole form
  const scanPos = new Float32Array(12);
  const scanGeo = new THREE.BufferGeometry(); scanGeo.setAttribute("position", new THREE.BufferAttribute(scanPos, 3));
  const scan = new THREE.LineLoop(scanGeo, lineMat(0.95, PINK)); scan.frustumCulled = false; ring.add(scan);

  // 6: communication – ripples spreading from one point
  const comm = new THREE.Group(); comm.position.copy(ST[6]); comm.rotation.set(0.15, 0, 0.12); scene.add(comm);
  const rings = [];
  { const NR = 26, SEG = 120;
    for (let i = 0; i < NR; i++) {
      const r = 0.3 + i * 0.15 + i * i * 0.0035, arr = new Float32Array(SEG * 3);
      const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(arr, 3));
      const l = new THREE.LineLoop(g, lineMat(0.7 - 0.55 * i / NR)); l.frustumCulled = false;
      rings.push({r, arr, g, SEG}); comm.add(l);
    }
    const a = []; for (let i = 0; i < 160; i++) { const t = rnd() * 6.28, r = 0.5 + rnd() * 4.4; a.push(Math.cos(t) * r, (rnd() - .3) * 1.8, Math.sin(t) * r); }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(a, 3));
    comm.add(new THREE.Points(g, ptsMat(0.06, 0.8)));
  }

  // 7: team – specialists in orbit around one centre
  const team = new THREE.Group(); team.position.copy(ST[7]); scene.add(team);
  const orbits = [], sats = [];
  [[2.1, 0.5, 0.2], [3.0, -0.7, 0.5], [3.9, 1.25, -0.35]].forEach(([r, rx, rz]) => {
    const o = new THREE.Group(); o.rotation.set(rx, 0, rz); o.add(new THREE.LineLoop(circle(r, 160), lineMat(0.28))); o.userData.r = r; team.add(o); orbits.push(o);
  });
  [new THREE.TetrahedronGeometry(0.36), new THREE.BoxGeometry(0.46, 0.46, 0.46), new THREE.OctahedronGeometry(0.36), new THREE.DodecahedronGeometry(0.34),
   new THREE.IcosahedronGeometry(0.36), new THREE.ConeGeometry(0.3, 0.56, 5), new THREE.TorusGeometry(0.26, 0.1, 6, 14), new THREE.CylinderGeometry(0.24, 0.24, 0.5, 6)]
  .forEach((g, i) => {
    const m = new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat(0.95)), o = orbits[i % 3];
    m.userData = {a: i * 2.4, v: (0.12 + 0.05 * (i % 4)) * (i % 2 ? -1 : 1), r: o.userData.r};
    o.add(m); sats.push(m);
  });
  const spokePos = new Float32Array(sats.length * 6);
  const spokeGeo = new THREE.BufferGeometry(); spokeGeo.setAttribute("position", new THREE.BufferAttribute(spokePos, 3));
  const spokes = new THREE.LineSegments(spokeGeo, lineMat(0.3, PINK)); spokes.frustumCulled = false; team.add(spokes);
  const core = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.75, 1)), lineMat(0.35)); team.add(core);
  { const a = []; for (let i = 0; i < 260; i++) { const t = rnd() * 6.28, p = Math.acos(rnd() * 2 - 1), r = 4.4 + rnd() * 1.6; a.push(Math.sin(p) * Math.cos(t) * r, Math.cos(p) * r, Math.sin(p) * Math.sin(t) * r); }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(a, 3)); core.userData.shell = new THREE.Points(g, ptsMat(0.06, 0.7)); team.add(core.userData.shell); }

  // 8: matter – everything gathered into one living mass
  const MN = 14000;
  const mGeo = new THREE.BufferGeometry();
  { const p = new Float32Array(MN * 3), r = new Float32Array(MN);
    for (let i = 0; i < MN; i++) { const y = 1 - 2 * (i + .5) / MN, q = Math.sqrt(1 - y*y), t = i * 2.39996323; p[3*i] = Math.cos(t) * q; p[3*i+1] = y; p[3*i+2] = Math.sin(t) * q; r[i] = rnd(); }
    mGeo.setAttribute("position", new THREE.BufferAttribute(p, 3)); mGeo.setAttribute("aR", new THREE.BufferAttribute(r, 1)); }
  const mMat = new THREE.ShaderMaterial({
    uniforms: {uT: {value: 0}, uPx: {value: 10}, uOp: {value: 0}, uA: {value: PINK}, uB: {value: PAPER}},
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uT; uniform float uPx; uniform float uOp;
      attribute float aR; varying float vA; varying float vMix;
      void main(){
        vec3 p = position;
        float n = sin(p.x*1.9+uT*.7)*sin(p.y*2.3+uT*.9)*sin(p.z*2.1-uT*.6);
        float n2 = sin(p.x*4.3-uT*1.1+p.y*3.1)*sin(p.z*4.7+uT*.8);
        float n3 = sin(p.y*8.+uT*1.3+p.x*6.)*sin(p.z*7.-uT);
        float d = 1.0 + .36*n + .14*n2 + .05*n3;
        p *= d * mix(.2, 1., pow(aR, .4)) * 2.7;
        vec4 mv = modelViewMatrix * vec4(p, 1.);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uPx * (.5 + aR) / -mv.z;
        vMix = smoothstep(.75, 1.3, d);
        vA = uOp * (.3 + .7*aR);
      }`,
    fragmentShader: `
      uniform vec3 uA; uniform vec3 uB; varying float vA; varying float vMix;
      void main(){
        float r = length(gl_PointCoord - .5);
        if (r > .5) discard;
        gl_FragColor = vec4(mix(uB, uA, vMix), smoothstep(.5, .15, r) * vA);
      }`
  });
  const matter = new THREE.Points(mGeo, mMat); matter.position.copy(ST[8]); matter.frustumCulled = false; scene.add(matter);

  // each motif is visible only around its own scene, so nothing from the next one shows in the background
  const fades = [];
  const fadeable = (obj, k0, k1) => {
    const mats = [];
    obj.traverse(o => { if (o.material && !mats.includes(o.material)) { o.material.userData.base = o.material.opacity; mats.push(o.material); } });
    fades.push({obj, mats, k0, k1});
  };
  const vis = (s, k0, k1) => { const d = s < k0 ? k0 - s : s > k1 ? s - k1 : 0; return clamp(1 - (d - 0.3) / 0.32); };
  fadeable(halo, 0, 0); fadeable(strat, 4, 4); fadeable(brand, 5, 5); fadeable(comm, 6, 6); fadeable(team, 7, 7);

  /* ---------- layout + loop ---------- */
  function resize() {
    W = innerWidth; H = innerHeight; mobile = W < 860;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    camera.aspect = W / H; camera.fov = mobile ? 58 : 45; camera.updateProjectionMatrix();
    camCurve = new THREE.CatmullRomCurve3(ST.map((p, i) => p.clone().add(OFF[i].clone().multiplyScalar(mobile ? 1.25 : 1))), false, "catmullrom", 0.5);
    mMat.uniforms.uPx.value = H * renderer.getPixelRatio() * 0.022;
    measure();
  }
  let mx = 0, my = 0, pmx = 0, pmy = 0;
  addEventListener("pointermove", e => { if (e.pointerType === "mouse") { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; } });

  const tmp = new THREE.Vector3(), tgt = new THREE.Vector3(), hp = new THREE.Vector3();
  let s = 0;
  function frame(ms) {
    const rm = RM.matches, t = rm ? 0 : ms * 0.001;
    const stv = target();
    s += (stv - s) * (rm ? 1 : 0.085);
    if (Math.abs(stv - s) < 1e-4) s = stv;
    const u = s / LAST, k0 = Math.min(LAST - 1, Math.floor(s)), f = s - k0;
    const near = k => Math.max(0, 1 - Math.abs(s - k));

    for (const f of fades) {
      const v = vis(s, f.k0, f.k1);
      f.obj.visible = v > 0.004;
      if (f.obj.visible) for (const m of f.mats) m.opacity = m.userData.base * v;
    }
    if (!rm) {
      dust.position.set(Math.sin(t * 0.05) * 0.6, Math.cos(t * 0.04) * 0.4, 0);
      dust2.position.set(Math.cos(t * 0.07) * 1.2, Math.sin(t * 0.06) * 0.9, Math.sin(t * 0.05) * 0.8);
      for (const g of glyphs) {
        g.rotation.set(g.userData.a + t * g.userData.v, g.userData.b + t * g.userData.v * 0.7, 0);
        g.position.y = g.userData.y + Math.sin(t * 0.2 + g.userData.a) * 0.3;
      }
    }

    // line + detail
    path.getPoint(u, hp);
    tube.geometry.setDrawRange(0, Math.max(1, Math.floor(fracAt(u) * TUBE)) * 36);
    const hs = 1 - 0.74 * ease(clamp(s));
    head.position.copy(hp); head.scale.setScalar(hs * (rm ? 1 : 1 + 0.02 * Math.sin(t * 2)));
    glow.position.copy(hp); glow.scale.setScalar(2.6 * hs + 0.7);
    halo.rotation.set(t * 0.15, t * 0.22, 0);

    // cloud → lattice
    const v12 = vis(s, 1, 2) * (s < 1 ? 0 : 1) + (s < 1 ? 1 : 0); // the cloud blooms on the way in, fades after the lattice
    pts.visible = latLines.visible = s < 2.7;
    if (s < 2.7) {
      const bloom = ease(clamp(s / 0.9)), drift = rm ? 0 : 0.12;
      for (let i = 0; i < NP; i++) {
        const m = ease(clamp((s - 1 - pDelay[i]) / 0.7)), w = (1 - m) * drift;
        const cx = ST[1].x + cloud[3*i] * bloom + Math.sin(t * .5 + pPhase[i]) * w, cy = ST[1].y + cloud[3*i+1] * bloom + Math.cos(t * .6 + pPhase[i]) * w, cz = ST[1].z + cloud[3*i+2] * bloom;
        pPos[3*i] = cx + (lattice[3*i] - cx) * m; pPos[3*i+1] = cy + (lattice[3*i+1] - cy) * m; pPos[3*i+2] = cz + (lattice[3*i+2] - cz) * m;
      }
      pGeo.attributes.position.needsUpdate = true;
      pts.material.opacity = 0.95 * clamp((s - 0.35) / 0.4) * v12;
      const lo = clamp((s - 1.25) / 0.6);
      latLines.material.opacity = 0.34 * lo * v12;
      if (lo > 0) {
        for (let i = 0; i < pairs.length; i++) { const p = pairs[i] * 3; lPos[3*i] = pPos[p]; lPos[3*i+1] = pPos[p+1]; lPos[3*i+2] = pPos[p+2]; }
        lGeo.attributes.position.needsUpdate = true;
      }
    }

    // solids
    if (s > 2.2 && s < 5.6) {
      sOuter.rotation.set(t * 0.07, t * 0.11, 0); sMid.rotation.set(-t * 0.16, t * 0.1, t * 0.05); sIn.rotation.set(t * 0.3, -t * 0.4, 0);
      sAxes.rotation.set(0.4, t * 0.05, 0.2); sRing.rotation.y = t * 0.2;
    }
    if (s > 3.4 && s < 6.6) {
      ring.rotation.y = t * 0.08;
      const sp = rm ? 0.6 : t * 0.22;
      for (let k = 0; k < 4; k++) ringPt(sp, k, scanPos, k * 3);
      scanGeo.attributes.position.needsUpdate = true;
    }
    if (s > 4.6 && s < 7.6) {
      for (const r of rings) {
        for (let j = 0; j < r.SEG; j++) {
          const a = j / r.SEG * 6.2832, rr = r.r * (1 + 0.035 * Math.sin(a * 3 + t * 0.7 + r.r));
          r.arr[3*j] = Math.cos(a) * rr; r.arr[3*j+2] = Math.sin(a) * rr;
          r.arr[3*j+1] = 0.42 * Math.sin(r.r * 2.3 - t * 1.5 + Math.sin(a * 2) * 0.5) * (1.1 - r.r / 6);
        }
        r.g.attributes.position.needsUpdate = true;
      }
      comm.rotation.y = t * 0.05;
    }
    if (s > 5.6) {
      team.rotation.y = t * 0.04;
      core.rotation.set(t * 0.1, t * 0.14, 0); core.userData.shell.rotation.y = -t * 0.03;
      team.updateMatrixWorld();
      sats.forEach((m, i) => {
        const a = m.userData.a + t * m.userData.v;
        m.position.set(Math.cos(a) * m.userData.r, 0, Math.sin(a) * m.userData.r);
        m.rotation.set(t * 0.4 + i, t * 0.3, 0);
        m.parent.updateMatrixWorld();
        m.getWorldPosition(tmp); team.worldToLocal(tmp);
        spokePos[6*i+3] = tmp.x; spokePos[6*i+4] = tmp.y; spokePos[6*i+5] = tmp.z;
      });
      spokeGeo.attributes.position.needsUpdate = true;
    }
    mMat.uniforms.uT.value = rm ? 2 : t * 0.5;
    mMat.uniforms.uOp.value = 0.85 * clamp((s - 7.35) / 0.5);
    matter.rotation.y = t * 0.06;
    matter.scale.setScalar(sentAt && !rm ? 1 + 0.22 * Math.exp(-(ms - sentAt) / 900) : 1);
    matter.visible = s > 7.35;

    // camera
    camCurve.getPoint(u, camera.position);
    tgtCurve.getPoint(u, tgt);
    if (!rm) { pmx += (mx - pmx) * 0.05; pmy += (my - pmy) * 0.05; camera.position.x += pmx * 0.9; camera.position.y -= pmy * 0.6; }
    camera.lookAt(tgt);
    const e = ease(f), a = SHIFT[k0], b = SHIFT[k0 + 1];
    const ox = mobile ? 0 : a[0] + (b[0] - a[0]) * e, oy = mobile ? 0.24 : a[1] + (b[1] - a[1]) * e;
    camera.setViewOffset(W, H, -ox * W, oy * H, W, H);

    renderer.render(scene, camera);
    ui(s, hp);
    requestAnimationFrame(frame);
  }

  resize();
  addEventListener("resize", resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  requestAnimationFrame(frame);
})();
</script>
</body>
